<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>沖繩親子自駕遊 v3｜2026.11.23 — 11.27 旅遊手帳</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-cream: #F5F3EB;
      --card-white: #FFFFFF;
      --ink-dark: #222222;
      --accent-yellow: #F6D365;
      --soft-pink: #F8EAE8;
      --soft-mint: #E3EFE0;
      --sky-blue: #CBE2F6;
      --emergency-red: #E05252;
    }

    body {
      background-color: #EAE6DA;
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink-dark);
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    .app-shell {
      max-width: 440px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: var(--bg-cream);
      position: relative;
      box-shadow: 0 0 0 2px #222222;
    }

    @media (min-width: 460px) {
      body {
        padding: 12px 0;
      }
      .app-shell {
        min-height: calc(100vh - 24px);
        border-radius: 32px;
        overflow-x: hidden;
      }
    }

    .hb-card {
      background-color: #FFFFFF;
      border: 2px solid #222222;
      border-radius: 22px;
    }

    .hb-pill {
      border: 1.5px solid #222222;
      border-radius: 9999px;
    }

    .hb-btn {
      transition: transform 0.12s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .hb-btn:active {
      transform: scale(0.96);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ==========================================
       UPGRADED HERO & ROUTE SVG ANIMATIONS
       ========================================== */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .sun-rays-spin {
      transform-origin: 332px 38px;
      animation: spinSlow 24s linear infinite;
    }

    @keyframes planeGlide {
      0%, 100% { transform: translate(0px, 0px) rotate(-2deg); }
      50% { transform: translate(6px, -4px) rotate(1.5deg); }
    }
    .plane-glide {
      animation: planeGlide 4.2s ease-in-out infinite;
    }

    @keyframes cloudDriftA {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(10px); }
    }
    @keyframes cloudDriftB {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-11px); }
    }
    .cloud-drift-a {
      animation: cloudDriftA 7.5s ease-in-out infinite;
    }
    .cloud-drift-b {
      animation: cloudDriftB 8.5s ease-in-out infinite;
    }

    @keyframes palmSway {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(3.5deg); }
    }
    .palm-sway {
      transform-origin: 48px 136px;
      animation: palmSway 3.8s ease-in-out infinite;
    }

    @keyframes carBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-1.6px); }
    }
    .car-bounce {
      animation: carBounce 0.7s ease-in-out infinite;
    }

    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .wheel-front {
      transform-origin: 263px 145px;
      animation: wheelSpin 1.1s linear infinite;
    }
    .wheel-rear {
      transform-origin: 223px 145px;
      animation: wheelSpin 1.1s linear infinite;
    }

    @keyframes waveShimmer {
      0%, 100% { transform: translateX(0px); opacity: 0.85; }
      50% { transform: translateX(6px); opacity: 0.4; }
    }
    .wave-shimmer {
      animation: waveShimmer 3s ease-in-out infinite;
    }

    @keyframes rainFall {
      0% { transform: translate(0px, -12px); opacity: 0; }
      30% { opacity: 0.85; }
      100% { transform: translate(-14px, 34px); opacity: 0; }
    }
    .rain-drop-1 { animation: rainFall 1.1s linear infinite; }
    .rain-drop-2 { animation: rainFall 1.1s linear 0.35s infinite; }
    .rain-drop-3 { animation: rainFall 1.1s linear 0.7s infinite; }

    @keyframes dashFlow {
      to { stroke-dashoffset: -24; }
    }
    .route-dash {
      animation: dashFlow 1.4s linear infinite;
    }

    @keyframes pinPulse {
      0% { transform: scale(1); opacity: 0.9; }
      70% { transform: scale(2.1); opacity: 0; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    .pin-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pinPulse 1.5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }
  </style>
</head>
<body>

  </div>

    let toastTimeout = null;
    function showToast(text, icon = '✅') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = text;
      document.getElementById('toast-icon').textContent = icon;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    function copyText(text, label = '內容') {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const successful = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (successful) {
          showToast(`已複製${label}：${text}`, '📋');
        } else {
          showToast(`請手動複製：${text}`, 'ℹ️');
        }
      } catch (err) {
        showToast(`複製失敗，請手動選取`, '⚠️');
      }
    }

    function updateLiveClocks() {
      const jstEl = document.getElementById('jst-clock');
      if (jstEl) {
        try {
          const nowJst = new Date().toLocaleTimeString('zh-TW', {
            timeZone: 'Asia/Tokyo',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
          });
          jstEl.textContent = `日本時間 ${nowJst}`;
        } catch (e) {
          const d = new Date(Date.now() + 9 * 3600 * 1000);
          const hh = String(d.getUTCHours()).padStart(2, '0');
          const mm = String(d.getUTCMinutes()).padStart(2, '0');
          jstEl.textContent = `日本時間 ${hh}:${mm}`;
        }
      }

      const dEl = document.getElementById('cd-days');
      const hEl = document.getElementById('cd-hours');
      const mEl = document.getElementById('cd-mins');
      const sEl = document.getElementById('cd-secs');
      const statusEl = document.getElementById('cd-caption');

      if (dEl && hEl && mEl && sEl) {
        const target = new Date('2026-11-23T13:05:00+08:00').getTime();
        const tripEnd = new Date('2026-11-27T17:15:00+08:00').getTime();
        const now = Date.now();
        const diff = target - now;

        if (diff > 0) {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const mins = Math.floor((diff / (1000 * 60)) % 60);
          const secs = Math.floor((diff / 1000) % 60);

          dEl.textContent = String(days).padStart(2, '0');
          hEl.textContent = String(hours).padStart(2, '0');
          mEl.textContent = String(mins).padStart(2, '0');
          sEl.textContent = String(secs).padStart(2, '0');
        } else if (now <= tripEnd) {
          const dayNum = Math.min(5, Math.max(1, Math.floor((now - target) / (1000 * 60 * 60 * 24)) + 1));
          dEl.textContent = `D${dayNum}`;
          hEl.textContent = '愉';
          mEl.textContent = '快';
          sEl.textContent = '玩';
          if (statusEl) statusEl.innerHTML = `🎉 沖繩親子自駕進行中！目前為 <span class="underline font-black">Day ${dayNum}</span>`;
        } else {
          dEl.textContent = '00';
          hEl.textContent = '00';
          mEl.textContent = '00';
          sEl.textContent = '00';
          if (statusEl) statusEl.textContent = '✨ 2026 沖繩親子自駕回憶圓滿達成！';
        }
      }
    }

    // ==========================================
    // 8. INTERACTION CONTROLLERS
    // ==========================================
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function switchTab(tabName) {
      state.activeTab = tabName;
      document.querySelectorAll('.nav-tab').forEach(btn => {
        const isTarget = btn.getAttribute('data-tab') === tabName;
        if (isTarget) {
          btn.style.backgroundColor = tabName === 'emergency' ? '#F8EAE8' : '#F6D365';
          btn.style.borderColor = '#222222';
        } else {
          btn.style.backgroundColor = 'transparent';
          btn.style.borderColor = 'transparent';
        }
      });
      renderCurrentTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentTab() {
      const container = document.getElementById('main-content');
      if (!container) return;
      switch (state.activeTab) {
        case 'home':
          container.innerHTML = renderHomeTab();
          updateLiveClocks();
          break;
        case 'itinerary':
          container.innerHTML = renderItineraryTab();
          break;
        case 'spots':
          container.innerHTML = renderSpotsTab();
          break;
        case 'checklist':
          container.innerHTML = renderChecklistTab();
          break;
        case 'tools':
          container.innerHTML = renderToolsTab();
          break;
        case 'info':
          container.innerHTML = renderInfoTab();
          break;
        case 'emergency':
          container.innerHTML = renderEmergencyTab();
          break;
      }
    }

    function toggleWeatherMode() {
      state.weatherMode = state.weatherMode === 'sunny' ? 'rainy' : 'sunny';
      saveState();
      renderCurrentTab();
      showToast(
        state.weatherMode === 'sunny' ? '已切換為 ☀️ 晴天模式' : '已切換為 🌧️ 雨天備案模式',
        state.weatherMode === 'sunny' ? '☀️' : '☔'
      );
    }

    function setFlightDir(dir) {
      state.flightDir = dir;
      renderCurrentTab();
    }

    function selectDay(dayNum) {
      state.selectedDay = dayNum;
      state.highlightedStopIdx = null;
      renderCurrentTab();
    }

    function highlightRouteStop(idx) {
      state.highlightedStopIdx = (state.highlightedStopIdx === idx) ? null : idx;
      renderCurrentTab();

    function setSpotFilter(filterId) {
      state.spotFilter = filterId;
      renderCurrentTab();

    // Nearby Fun Spot Modal Controllers
    function openNearbyModal(nbId) {
      const nb = NEARBY_LOOKUP[nbId];

      document.getElementById('nb-name').textContent = nb.name;
      document.getElementById('nb-dist').textContent = `🚗 ${nb.dist}`;
      document.getElementById('nb-hours').textContent = `🕒 ${nb.hours}`;
      document.getElementById('nb-desc').textContent = nb.desc;
      document.getElementById('nb-mapcode').textContent = nb.mapcode;

      const mcBtn = document.getElementById('nb-mapcode-btn');
      mcBtn.onclick = () => copyText(nb.mapcode, 'MapCode');

      const navBtn = document.getElementById('nb-nav-btn');
      navBtn.onclick = () => openGoogleMaps(nb.mapQuery);

      const saveBtn = document.getElementById('nb-save-btn');
      const updateSaveBtn = () => {
        const isSaved = !!state.savedNearby[nb.id];
        saveBtn.style.backgroundColor = isSaved ? '#E3EFE0' : '#FFFFFF';
        saveBtn.innerHTML = isSaved
          ? '<span>✅</span><span>已加入順遊標記</span>'
          : '<span>⭐</span><span>加入順遊標記</span>';
      };
      updateSaveBtn();

      saveBtn.onclick = () => {
        state.savedNearby[nb.id] = !state.savedNearby[nb.id];
        saveState();
        updateSaveBtn();
        renderCurrentTab();
        showToast(state.savedNearby[nb.id] ? '已標記為想去的順遊景點！' : '已取消順遊標記', '⭐');
      };

      const modal = document.getElementById('nearby-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

      const modal = document.getElementById('nearby-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleCheckItem(cIdx, iIdx) {
      state.checklist[cIdx].items[iIdx].done = !state.checklist[cIdx].items[iIdx].done;
      saveState();
      renderCurrentTab();
    }

    function addCheckItem() {
      const input = document.getElementById('new-check-input');
      const val = input ? input.value.trim() : '';
      if (!val) return;
      state.checklist[0].items.unshift({
        id: 'custom_' + Date.now(),
        text: val,
        done: false
      });
      saveState();
      renderCurrentTab();
      showToast('已加入打包清單', '📝');

      state.checklist[cIdx].items.splice(iIdx, 1);

    function updateRate(val) {
      const num = parseFloat(val);
      if (num > 0) {
        state.exchangeRate = num;
        saveState();
        renderCurrentTab();
      }
    }

    function updateJpyAmount(val) {
      state.jpyAmount = Math.max(0, parseFloat(val) || 0);
      const effectiveJpy = state.taxFree ? Math.round(state.jpyAmount / 1.1) : state.jpyAmount;
      const twdVal = Math.round(effectiveJpy * state.exchangeRate);
      const outEl = document.getElementById('twd-output');
      if (outEl) {
        outEl.textContent = `NT$ ${twdVal.toLocaleString()}`;
      }
    }

    function setPresetJpy(amt) {
      state.jpyAmount = amt;
      renderCurrentTab();
    }

    function toggleTaxFree() {
      state.taxFree = !state.taxFree;
      renderCurrentTab();
    }

    function addExpense() {
      const cat = document.getElementById('exp-cat').value;
      const title = document.getElementById('exp-title').value.trim();
      const amt = parseFloat(document.getElementById('exp-amt').value);
      if (!title || !(amt > 0)) {
        showToast('請輸入項目名稱與日幣金額', '⚠️');
        return;
      }
      state.expenses.unshift({ cat, title, amount: Math.round(amt), currency: 'JPY' });
      saveState();
      renderCurrentTab();
      showToast('已新增消費紀錄', '💰');
    }

    function deleteExpense(idx) {
      state.expenses.splice(idx, 1);
      saveState();
      renderCurrentTab();

      document.getElementById('edit-title').value = state.tripMeta.title;

      const modal = document.getElementById('edit-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');

    function saveTripMeta() {
      state.tripMeta = {
        title: document.getElementById('edit-title').value.trim() || DEFAULT_META.title,

    window.onload = function () {
      switchTab('home');
      setInterval(updateLiveClocks, 1000);
