    :root {
      --bg-cream: #F5F3EB;
      --card-white: #FFFFFF;
      --ink-dark: #222222;
      --accent-yellow: #F6D365;
      --soft-pink: #F8EAE8;
      --soft-mint: #E3EFE0;
      --sky-blue: #CBE2F6;
      --emergency-red: #E05252;
    }

    body {
      background-color: #EAE6DA;
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink-dark);
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    .app-shell {
      max-width: 440px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: var(--bg-cream);
      position: relative;
      box-shadow: 0 0 0 2px #222222;
    }

    @media (min-width: 460px) {
      body {
        padding: 12px 0;
      }
      .app-shell {
        min-height: calc(100vh - 24px);
        border-radius: 32px;
        overflow-x: hidden;
      }
    }

    .hb-card {
      background-color: #FFFFFF;
      border: 2px solid #222222;
      border-radius: 22px;
    }

    .hb-pill {
      border: 1.5px solid #222222;
      border-radius: 9999px;
    }

    .hb-btn {
      transition: transform 0.12s ease, background-color 0.15s ease;
      cursor: pointer;
    }

    .hb-btn:active {
      transform: scale(0.96);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .animate-float {
      animation: floatSlow 3.5s ease-in-out infinite;
    }

    @keyframes dashFlow {
      to { stroke-dashoffset: -24; }
    }
    .route-dash {
      animation: dashFlow 1.6s linear infinite;
    }
  </style>
</head>

    let toastTimeout = null;
    function showToast(text, icon = '✅') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = text;
      document.getElementById('toast-icon').textContent = icon;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    function copyText(text, label = '內容') {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const successful = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (successful) {
          showToast(`已複製${label}：${text}`, '📋');
        } else {
          showToast(`請手動複製：${text}`, 'ℹ️');
        }
      } catch (err) {
        showToast(`複製失敗，請手動選取`, '⚠️');
      }
    }

    function updateLiveClocks() {
      const jstEl = document.getElementById('jst-clock');
      if (jstEl) {
        try {
          const nowJst = new Date().toLocaleTimeString('zh-TW', {
            timeZone: 'Asia/Tokyo',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
          });
          jstEl.textContent = `日本時間 ${nowJst}`;
        } catch (e) {
          const d = new Date(Date.now() + 9 * 3600 * 1000);
          const hh = String(d.getUTCHours()).padStart(2, '0');
          const mm = String(d.getUTCMinutes()).padStart(2, '0');
          jstEl.textContent = `日本時間 ${hh}:${mm}`;
        }
      }

      const dEl = document.getElementById('cd-days');
      const hEl = document.getElementById('cd-hours');
      const mEl = document.getElementById('cd-mins');
      const sEl = document.getElementById('cd-secs');
      const statusEl = document.getElementById('cd-caption');

      if (dEl && hEl && mEl && sEl) {
        const target = new Date('2026-11-23T13:05:00+08:00').getTime();
        const tripEnd = new Date('2026-11-27T17:15:00+08:00').getTime();
        const now = Date.now();
        const diff = target - now;

        if (diff > 0) {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const mins = Math.floor((diff / (1000 * 60)) % 60);
          const secs = Math.floor((diff / 1000) % 60);

          dEl.textContent = String(days).padStart(2, '0');
          hEl.textContent = String(hours).padStart(2, '0');
          mEl.textContent = String(mins).padStart(2, '0');
          sEl.textContent = String(secs).padStart(2, '0');
        } else if (now <= tripEnd) {
          const dayNum = Math.min(5, Math.max(1, Math.floor((now - target) / (1000 * 60 * 60 * 24)) + 1));
          dEl.textContent = `D${dayNum}`;
          hEl.textContent = '愉';
          mEl.textContent = '快';
          sEl.textContent = '玩';
          if (statusEl) statusEl.innerHTML = `🎉 沖繩親子自駕進行中！目前為 <span class="underline font-black">Day ${dayNum}</span>`;
        } else {
          dEl.textContent = '00';
          hEl.textContent = '00';
          mEl.textContent = '00';
          sEl.textContent = '00';
          if (statusEl) statusEl.textContent = '✨ 2026 沖繩親子自駕回憶圓滿達成！';
        }
      }
    }

    // ==========================================
    // 8. INTERACTION CONTROLLERS
    // ==========================================
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function switchTab(tabName) {
      state.activeTab = tabName;
      document.querySelectorAll('.nav-tab').forEach(btn => {
        const isTarget = btn.getAttribute('data-tab') === tabName;
        if (isTarget) {
          btn.style.backgroundColor = tabName === 'emergency' ? '#F8EAE8' : '#F6D365';
          btn.style.borderColor = '#222222';
        } else {
          btn.style.backgroundColor = 'transparent';
          btn.style.borderColor = 'transparent';
        }
      });
      renderCurrentTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentTab() {
      const container = document.getElementById('main-content');
      if (!container) return;
      switch (state.activeTab) {
        case 'home':
          container.innerHTML = renderHomeTab();
          updateLiveClocks();
          break;
        case 'itinerary':
          container.innerHTML = renderItineraryTab();
          break;
        case 'spots':
          container.innerHTML = renderSpotsTab();
          break;
        case 'checklist':
          container.innerHTML = renderChecklistTab();
          break;
        case 'tools':
          container.innerHTML = renderToolsTab();
          break;
        case 'info':
          container.innerHTML = renderInfoTab();
          break;
        case 'emergency':
          container.innerHTML = renderEmergencyTab();
          break;
      }
    }

      state.weatherMode = state.weatherMode === 'sunny' ? 'rainy' : 'sunny';
      saveState();

        state.weatherMode === 'sunny' ? '已切換為 ☀️ 晴天模式' : '已切換為 🌧️ 雨天備案模式',
        state.weatherMode === 'sunny' ? '☀️' : '☔'
      );
    }

      state.checklist[0].items.unshift({

        done: false
      });
      saveState();
      renderCurrentTab();
      showToast('已加入打包清單', '📝');

      renderCurrentTab();
      showToast('已重置所有勾選項目', '🔄');

    function toggleFunpass(key) {
      state.funpassRedeemed[key] = !state.funpassRedeemed[key];

      showToast(state.funpassRedeemed[key] ? '已標記為核銷使用！' : '已改回待使用狀態', '🎫');

    function updateRate(val) {
      const num = parseFloat(val);
      if (num > 0) {
        state.exchangeRate = num;
        saveState();
        renderCurrentTab();
      }
    }

    function updateJpyAmount(val) {
      state.jpyAmount = Math.max(0, parseFloat(val) || 0);
      const effectiveJpy = state.taxFree ? Math.round(state.jpyAmount / 1.1) : state.jpyAmount;
      const twdVal = Math.round(effectiveJpy * state.exchangeRate);
      const outEl = document.getElementById('twd-output');
      if (outEl) {
        outEl.textContent = `NT$ ${twdVal.toLocaleString()}`;
      }
    }

    function setPresetJpy(amt) {
      state.jpyAmount = amt;
      renderCurrentTab();
    }

    function toggleTaxFree() {
      state.taxFree = !state.taxFree;
      renderCurrentTab();
    }

    function addExpense() {
      const cat = document.getElementById('exp-cat').value;
      const title = document.getElementById('exp-title').value.trim();
      const amt = parseFloat(document.getElementById('exp-amt').value);
      if (!title || !(amt > 0)) {
        showToast('請輸入項目名稱與日幣金額', '⚠️');
        return;
      }
      state.expenses.unshift({ cat, title, amount: Math.round(amt), currency: 'JPY' });
      saveState();
      renderCurrentTab();
      showToast('已新增消費紀錄', '💰');
    }

    function deleteExpense(idx) {
      state.expenses.splice(idx, 1);
      saveState();
      renderCurrentTab();
    }

    function openEditModal() {
      document.getElementById('edit-title').value = state.tripMeta.title;
      document.getElementById('edit-subtitle').value = state.tripMeta.subtitle;
      document.getElementById('edit-regions').value = state.tripMeta.regions;
      document.getElementById('edit-travelers').value = state.tripMeta.travelers;
      document.getElementById('edit-memo').value = state.tripMeta.memo || '';
      const modal = document.getElementById('edit-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeEditModal() {
      const modal = document.getElementById('edit-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveTripMeta() {
      state.tripMeta = {
        title: document.getElementById('edit-title').value.trim() || DEFAULT_META.title,
        subtitle: document.getElementById('edit-subtitle').value.trim() || DEFAULT_META.subtitle,
        regions: document.getElementById('edit-regions').value.trim() || DEFAULT_META.regions,
        travelers: document.getElementById('edit-travelers').value.trim() || DEFAULT_META.travelers,
        memo: document.getElementById('edit-memo').value.trim()
      };
      saveState();
      closeEditModal();
      renderCurrentTab();
      showToast('旅遊手帳資訊已更新', '✏️');
    }

    function resetTripMeta() {
      state.tripMeta = { ...DEFAULT_META };
      saveState();
      closeEditModal();
      renderCurrentTab();
      showToast('已恢復預設旅程設定', '🔄');
    }

    function openPhraseModal(idx) {
      const p = PHRASE_CARDS[idx];
      document.getElementById('pm-badge').textContent = p.tag;
      document.getElementById('pm-jp').textContent = p.jp;
      document.getElementById('pm-romaji').textContent = p.romaji;
      document.getElementById('pm-zh').textContent = p.zh;
      const modal = document.getElementById('phrase-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closePhraseModal() {
      const modal = document.getElementById('phrase-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    window.onload = function () {
      switchTab('home');
      setInterval(updateLiveClocks, 1000);
    };
  </script>
</body>
</html>
